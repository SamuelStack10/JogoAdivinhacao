<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Adivinhação</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div>
        <h1>Jogo de Adivinhação</h1>
        <p>Pense em um número entre 1 e 100 e tente adivinhar!</p>

        <input type="number" id="palpite" min="1" max="100">
        <button onclick="verificar()">Tentar</button>

        <p id="mensagem"></p>

        <p id="tentativas">Tentativas: 0</p>
        </div>
    </div>

  <script>
    let numeroSecreto = Math.floor(Math.random() * 100) + 1;
    let tentativas = 0;

    function verificar() {
      const palpite = Number(document.getElementById("palpite").value);
      const mensagem = document.getElementById("mensagem");
      const tentativasElement = document.getElementById("tentativas");

      tentativas++;

      if (isNaN(palpite) || palpite < 1 || palpite > 100) {
        mensagem.innerHTML = "❌ Por favor, insira um número válido entre 1 e 100.";
        tentativasElement.innerHTML = `Tentativas: ${tentativas}`;
        return;
      }

      if(palpite === numeroSecreto && tentativas === 1) {
        mensagem.innerHTML = `🎉 Incrível! Você acertou de primeira!`;
        tentativasElement.innerHTML = `Tentativas: ${tentativas}`;

        if (confirm(`🎉 Incrível! Você acertou de primeira! Deseja jogar novamente?`)) {
          numeroSecreto = Math.floor(Math.random() * 100) + 1;
          tentativas = 0;
          mensagem.innerHTML = "";
          tentativasElement.innerHTML = `Tentativas: ${tentativas}`;
          document.getElementById("palpite").value = "";
        }

      } else

      if (palpite === numeroSecreto) {
        mensagem.innerHTML = `🎉 Parabéns! Você acertou em ${tentativas} tentativa(s)!`;
        tentativasElement.innerHTML = `Tentativas: ${tentativas}`;


        if (confirm(`🎉 Parabéns! Você acertou em ${tentativas} tentativa(s)! Deseja jogar novamente?`)) {
          numeroSecreto = Math.floor(Math.random() * 100) + 1;
          tentativas = 0;
          mensagem.innerHTML = "";
          tentativasElement.innerHTML = `Tentativas: ${tentativas}`;
          document.getElementById("palpite").value = "";
        }

      } else if (palpite < numeroSecreto) {
        mensagem.innerHTML = "⬇️ Muito baixo! Tente novamente.";
        tentativasElement.innerHTML = `Tentativas: ${tentativas}`;
      } else {
        mensagem.innerHTML = "⬆️ Muito alto! Tente novamente.";
        tentativasElement.innerHTML = `Tentativas: ${tentativas}`;
      }
      

    }
    console.log(numeroSecreto)

    document.addEventListener("keypress", function(event) {
      if (event.key === "Enter") {
        verificar();
      }
    });
  </script>
</body>
</html>
