<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Adivinhação</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div>
        <h1>Jogo de Adivinhação</h1>
        <p>Pense em um número entre 1 e 100 e tente adivinhar!</p>

        <input type="number" id="palpite" min="1" max="100">
        <button onclick="verificar()">Tentar</button>

        <p id="mensagem"></p>
        </div>
    </div>

  <script>
    let numeroSecreto = Math.floor(Math.random() * 100) + 1;
    let tentativas = 0;

    function verificar() {
      const palpite = Number(document.getElementById("palpite").value);
      const mensagem = document.getElementById("mensagem");

      tentativas++;

      if (palpite === numeroSecreto) {
        mensagem.innerHTML = `🎉 Parabéns! Você acertou em ${tentativas} tentativa(s)!`;

        if (confirm(`🎉 Parabéns! Você acertou em ${tentativas} tentativa(s)! Deseja jogar novamente?`)) {
          numeroSecreto = Math.floor(Math.random() * 100) + 1;
          tentativas = 0;
          mensagem.innerHTML = "";
          document.getElementById("palpite").value = "";
        }

      } else if (palpite < numeroSecreto) {
        mensagem.innerHTML = "⬇ Muito baixo! Tente novamente.";

      } else {
        mensagem.innerHTML = "⬆ Muito alto! Tente novamente.";
      }

    }
    console.log(numeroSecreto);

    document.addEventListener("keypress", function(event) {
      if (event.key === "Enter") {
        verificar();
      }
    });
  </script>
</body>
</html>
